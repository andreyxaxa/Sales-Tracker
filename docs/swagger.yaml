      payment_method:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      sold_at:
        type: string
      unit_price:
        type: string
    required:
    - payment_method
    - product_id
    - quantity
    - sold_at
    - unit_price
    type: object
  request.UpdateProductPriceRequest:
    properties:
      new_price:
        type: string
    required:
    - new_price
    type: object
  response.AnalyticsResponse:
    properties:
      group_label:
        type: string
      value:
        type: number
    type: object
  response.CreateCategoryResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.CreateProductResponse:
    properties:
      base_price:
        type: string
      category_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  response.CreateSaleResponse:
    properties:
      id:
        type: integer
      payment_method:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      sold_at:
        type: string
      unit_price:
        type: string
    type: object
  response.Error:
    properties:
      error:
        type: string
    type: object
  response.GetCategoryResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.GetProductResponse:
    properties:
      base_price:
        type: string
      category_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  response.GetSaleResponse:
    properties:
      id:
        type: integer
      payment_method:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      sold_at:
        type: string
      unit_price:
        type: string
    type: object
  response.UpdateProductBasePriceResponse:
    properties:
      base_price:
        type: string
      category_id:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
