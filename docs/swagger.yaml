  /v1/analytics/median:
    get:
      description: Returns the median(p50) for period
      parameters:
      - description: Start of range (from=2026-01-10T12:15:31+03:00)
        in: query
        name: from
        required: true
        type: string
      - description: End of range   (to=2026-03-22T19:07:13+03:00)
        in: query
        name: to
        required: true
        type: string
      - description: If you need a specific product
        in: query
        name: product-id
        type: string
      - description: If you need a specific category
        in: query
        name: category-id
        type: string
      - description: If you need a specific payment method
        in: query
        name: payment-method
        type: string
      - description: Grouping by different fields (group-by=day/month/week/category/product)
        in: query
        name: group-by
        type: string
      - description: Sorting by field (sort-by=group/value)
        in: query
        name: sort-by
        type: string
      - description: Sorting order (sort-order=asc/desc)
        in: query
        name: sort-order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.AnalyticsResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Get median
      tags:
      - analytics
