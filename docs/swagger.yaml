definitions:
  request.CreateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  request.CreateProductRequest:
    properties:
      base_price:
        type: string
      category_id:
        type: integer
      name:
        type: string
    required:
    - base_price
    - category_id
    - name
    type: object
  request.CreateSaleRequest:
